<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QuickToolsHub</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo">QuickToolsHub</div>

    <nav>
      <button class="active">🏠 Dashboard</button>
      <button>🎬 YouTube</button>
      <button>🎵 TikTok</button>
      <button>📸 Instagram</button>
      <button>⚙️ Settings</button>
    </nav>

    <div class="footer">
      v1.0 Free Panel
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <header class="topbar">
      <h1>Dashboard</h1>
      <p>All tools in one place</p>
    </header>

    <section class="grid">

      <!-- TOOL CARD -->
      <div class="card">
        <h2>YouTube Downloader</h2>
        <p>MP3 / MP4 download tool</p>

        <input id="youtubeUrl" placeholder="YouTube link">
        
        <select id="format">
          <option value="mp3">MP3</option>
          <option value="mp4">MP4</option>
        </select>

        <button onclick="downloadVideo()">Open Tool</button>
      </div>

      <!-- OTHER CARDS -->
      <div class="card disabled">
        <h2>TikTok Downloader</h2>
        <p>Coming soon</p>
      </div>

      <div class="card disabled">
        <h2>Instagram Downloader</h2>
        <p>Coming soon</p>
      </div>

    </section>

    <div id="status"></div>

  </main>

</div>

<script src="script.js"></script>
</body>
</html>
