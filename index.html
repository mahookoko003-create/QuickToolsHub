<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QuickToolsHub</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo">QuickToolsHub</div>

    <div class="nav-links">
      <a href="#">YouTube</a>
      <a href="#">TikTok</a>
      <a href="#">Instagram</a>
    </div>
  </nav>

  <main class="container">

    <section class="hero">

      <h1>All-in-One Media Downloader</h1>

      <p>
        Download YouTube, TikTok, Instagram videos and more.
      </p>

      <div class="download-box">

        <input
          type="text"
          id="youtubeUrl"
          placeholder="Paste YouTube link here..."
        >

        <select id="format">
          <option value="mp3">MP3</option>
          <option value="mp4">MP4</option>
        </select>

        <button onclick="downloadVideo()">
          Download
        </button>

      </div>

      <div id="status"></div>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
